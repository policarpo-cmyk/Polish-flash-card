<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Polish Cards">
<title>Polish Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--ink:#14213d;--mute:#5b6b82;--card:#fff;--back:#14213d;--backink:#fff;--red:#c8102e;--ok:#0f766e;--line:#cfd8e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--ink:#e8eef7;--mute:#8fa0b8;--card:#17203a;--back:#e8eef7;--backink:#0c1220;--red:#ff5a73;--ok:#2dd4bf;--line:#2a3555}}
:root[data-theme="dark"]{--bg:#0c1220;--ink:#e8eef7;--mute:#8fa0b8;--card:#17203a;--back:#e8eef7;--backink:#0c1220;--red:#ff5a73;--ok:#2dd4bf;--line:#2a3555}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.4rem;font-weight:800;margin:4px 0 0;letter-spacing:-.02em}
.row{display:flex;gap:8px}
.seg{display:flex;flex:1;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);font:600 1rem inherit;font-family:inherit;padding:10px 0;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.card{perspective:1000px;height:300px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:10px}
.front{background:var(--card);border:1.5px solid var(--line)}
.backf{background:var(--back);color:var(--backink);transform:rotateY(180deg)}
.word{font-size:2.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.hint{font-size:.85rem;color:var(--mute)}
.backf .hint{color:var(--backink);opacity:.7}
.say{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font:600 .9rem inherit;font-family:inherit;cursor:pointer}
.act button{flex:1;border:0;border-radius:14px;padding:16px 0;font:700 1.05rem inherit;font-family:inherit;color:#fff;cursor:pointer}
.again{background:var(--red)}.know{background:var(--ok)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.link{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.ex{font-size:1.05rem;line-height:1.35;cursor:pointer}.ex2{font-size:1.05rem;line-height:1.35;opacity:.85}
.done{height:300px;border:1.5px dashed var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
</style>
</head>
<body>
<main>
<h1>Polish Cards</h1>
<div class="row"><div class="seg" id="lv"></div></div>
<div class="row">
<div class="seg" id="lg"></div>
<div class="seg" id="dr" style="flex:.9"></div>
</div>
<div id="stage"></div>
<div class="prog"><i id="bar"></i></div>
<div class="meta"><span id="cnt"></span><span><button class="link" id="shuf">Shuffle</button> · <button class="link" id="rst">Reset level</button></span></div>
</main>

pisać":["Piszę do mamy.","I'm writing to mom."],"słuchać":["Słucham muzyki.","I'm listening to music."],"spać":["Chcę spać.","I want to sleep."],"pracować":["Pracuję w biurze.","I work in an office."],"uczyć się":["Uczę się polskiego.","I'm learning Polish."],"dawać":["Daję ci klucz.","I'm giving you the key."],"brać":["Biorę ten bilet.","I'm taking this ticket."],"płacić":["Płacę kartą.","I'm paying by card."],"pytać":["Pytam o drogę.","I'm asking for directions."],"odpowiadać":["Odpowiadam na pytanie.","I'm answering the question."],"kochać":["Kocham moją rodzinę.","I love my family."],"móc":["Czy mogę wejść?","May I come in?"],"musieć":["Muszę iść do pracy.","I have to go to work."],"umieć":["Umiem gotować.","I know how to cook."],"otwierać":["Otwieram okno.","I'm opening the window."],"zamykać":["Zamykam drzwi.","I'm closing the door."],"zaczynać":["Zaczynam pracę o ósmej.","I start work at eight."],"kończyć":["Kończę pracę o czwartej.","I finish work at four."],"przychodzić":["Przychodzę do pracy rano.","I come to work in the morning."],"wracać":["Wracam do domu.","I'm returning home."],"znaleźć":["Nie mogę znaleźć klucza.","I can't find the key."],"gotować":["Gotuję zupę.","I'm cooking soup."],"grać":["Dzieci grają w piłkę.","The children are playing ball."],"nazywać się":["Jak się nazywasz?","What are you called?"],"dzwonić":["Dzwonię do mamy.","I'm calling mom."],"dobranoc":["Dobranoc, śpij dobrze.","Good night, sleep well."],"do widzenia":["Do widzenia, do jutra!","Goodbye, see you tomorrow!"],"smacznego":["Smacznego! Obiad jest gotowy.","Enjoy your meal! Lunch is ready."],"na zdrowie":["Na zdrowie!","Cheers!"]};
const D={};for(const k in RAW)D[k]=RAW[k].split(";").map(s=>{const p=s.split("|");return{pl:p[0],en:p[1],es:p[2],t:p[3]||""}});
const INT=[0,1,2,4,8,16],DAY=864e5;
let S={lv:"A1",lg:"en",dr:"fwd",c:{},order:{},pos:0};
try{const x=JSON.parse(localStorage.getItem("plcards2")||"null");if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem("plcards2",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const cs=i=>{const c=(S.c[S.lv]=S.c[S.lv]||{});return c[i]||(c[i]={b:0,d:0})};
function tagTxt(t){if(!t)return"";const M={m:"masculine noun",f:"feminine noun",n:"neuter noun",pl:"plural noun",v:"verb"};if(M[t])return M[t];if(t[1]===":"){const x=t.slice(2);return t[0]==="v"?"verb · perfective: "+x:"perfective verb · imperfective: "+x}return""}
function seg(el,opts,cur,fn){el.innerHTML="";opts.forEach(([v,t])=>{const b=document.createElement("button");b.textContent=t;if(v===cur)b.className="on";b.onclick=()=>{fn(v);S.pos=0;save();draw()};el.appendChild(b)})}
function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="pl-PL";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function draw(){
seg($("lv"),Object.keys(D).map(k=>[k,k]),S.lv,v=>S.lv=v);
seg($("lg"),[["en","English"],["es","Español"]],S.lg,v=>S.lg=v);
seg($("dr"),[["fwd","PL → "+S.lg.toUpperCase()],["rev",S.lg.toUpperCase()+" → PL"]],S.dr,v=>S.dr=v);
const d=D[S.lv],now=Date.now();
if(!S.order[S.lv]||S.order[S.lv].length!==d.length)S.order[S.lv]=[...d.keys()];
const all=S.order[S.lv],q=all.filter(i=>cs(i).d<=now),mast=all.filter(i=>cs(i).b>=5).length,st=$("stage");
$("cnt").textContent=q.length+" due · "+mast+" of "+d.length+" mastered";
$("bar").style.width=(mast/d.length*100)+"%";
if(!q.length){const nx=Math.min(...all.map(i=>cs(i).d)),h=Math.ceil((nx-now)/36e5);
st.innerHTML='<div class="done"><div class="word" style="font-size:1.8rem">Done for now</div><div class="hint">Next '+S.lv+' card is due in '+(h<24?h+' h':Math.round(h/24)+' days')+'.<br>Try another level or reset this one.</div></div>';return}
const i=q[S.pos%q.length],w=d[i],tr=w[S.lg],fwd=S.dr==="fwd";
const ex=EX[w.pl];const tg=w.t?'<div class="hint">'+tagTxt(w.t)+'</div>':'';
const pl='<div class="word">'+w.pl+'</div><button class="say" data-s="1">Listen</button>'+tg+(ex?'<div class="ex" data-s="2">'+ex[0]+'</div>':'');
const ot='<div class="word">'+tr+'</div>'+(ex?'<div class="ex2">'+ex[1]+'</div>':'');
st.innerHTML='<div class="card" id="card" tabindex="0" role="button" aria-label="Flip card"><div class="in"><div class="face front">'+(fwd?pl:ot)+'<div class="hint">Tap to flip</div></div><div class="face backf">'+(fwd?ot:pl)+'</div></div></div><div class="row act" style="margin-top:14px"><button class="again" id="ag">Again</button><button class="know" id="kn">Know it</button></div>';
const c=$("card");
c.onclick=e=>{if(e.target.dataset.s){e.stopPropagation();say(e.target.dataset.s==="2"?ex[0]:w.pl);return}c.classList.toggle("flip")};
c.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();c.classList.toggle("flip")}};
$("ag").onclick=()=>{const x=cs(i);x.b=0;x.d=0;S.pos++;save();draw()};
$("kn").onclick=()=>{const x=cs(i);x.b=Math.min(x.b+1,5);x.d=Date.now()+INT[x.b]*DAY;save();draw()};
}
$("shuf").onclick=()=>{S.order[S.lv]=shuffle(D[S.lv].length);S.pos=0;save();draw()};
$("rst").onclick=()=>{S.c[S.lv]={};S.pos=0;save();draw()};
draw();
</script>
